<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Someone Special 💖</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:black;
    color:white;
    text-align:center;
    overflow:hidden;
}

.screen {
    display:none;
    position:absolute;
    width:100%;
    top:30%;
}

button {
    padding:12px 25px;
    font-size:18px;
    border-radius:25px;
    border:none;
    cursor:pointer;
}

/* Stars */
.star {
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
    from {opacity:0.2;}
    to {opacity:1;}
}

/* Hearts */
.heart {
    position:absolute;
    font-size:30px;
    cursor:pointer;
    animation: float 4s linear;
}
@keyframes float {
    from {transform: translateY(100vh);}
    to {transform: translateY(-10vh);}
}

img {
    width:200px;
    border-radius:20px;
    margin:10px;
}

</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen" style="display:block;">
    <h1>🌌 Tap to Enter</h1>
    <button onclick="startStory()">Start 💖</button>
</div>

<!-- STORY -->
<div id="story" class="screen">
    <h2 id="storyText"></h2>
</div>

<!-- GAME -->
<div id="game" class="screen">
    <h2>Catch My Love 💖</h2>
    <p id="score">Score: 0</p>
</div>

<!-- MEMORY -->
<div id="memory" class="screen">
    <h2>Some Moments 📸</h2>
    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <br>
    <button onclick="finalScene()">Next ➡️</button>
</div>

<!-- FINAL -->
<div id="final" class="screen">
    <h1 id="finalText"></h1>
</div>

<script>
// stars background
for(let i=0;i<100;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    document.body.appendChild(s);
}

function startStory(){
    switchScreen("start","story");
    typeText("storyText","Ek ladka tha... jo ek ladki ko dekh ke smile karna nahi bhoolta tha 💖",nextGame);
}

function nextGame(){
    setTimeout(()=>{
        switchScreen("story","game");
        startGame();
    },2000);
}

let score=0;

function startGame(){
    let game=setInterval(()=>{
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";

        heart.onclick=()=>{
            score++;
            document.getElementById("score").innerText="Score: "+score;
            heart.remove();
        };

        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),4000);
    },500);

    setTimeout(()=>{
        clearInterval(game);
        switchScreen("game","memory");
    },10000);
}

function finalScene(){
    switchScreen("memory","final");
    typeText("finalText","You are my moon 🌙 among thousands of stars ✨\nHappy Birthday 💖",null);
}

function typeText(id,text,callback){
    let i=0;
    let el=document.getElementById(id);
    el.innerHTML="";
    function type(){
        if(i<text.length){
            el.innerHTML+=text.charAt(i);
            i++;
            setTimeout(type,40);
        } else if(callback){
            callback();
        }
    }
    type();
}

function switchScreen(hide,show){
    document.getElementById(hide).style.display="none";
    document.getElementById(show).style.display="block";
}
</script>

</body>
</html>
